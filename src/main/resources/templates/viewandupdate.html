<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile Management - TaskHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div class="container">
        <h2>👤 Profile Management</h2>
        <h3>View and Update Your Information</h3>

        <!-- Success/Error Message -->
        <div th:if="${message}" style="background-color: #e8f5e8; color: #2e7d32; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            <p th:text="${message}"></p>
        </div>

        <!-- Profile Form -->
        <form th:action="@{/api/auth/update}" th:object="${signUpRequest}" method="post" id="profileForm">
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required />
            </div>

            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address" required />
            </div>
  
			<div>
                <label for="password">New Password:</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Leave blank to keep current password" />
                <small style="color: #666; font-size: 12px;">Only fill if you want to change your password</small>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" onclick="submitForm()" style="flex: 1;">💾 Update Profile</button>
                <button type="button" onclick="goBack()" style="flex: 1; background-color: #95a5a6;">⬅️ Go Back</button>
            </div>
        </form>

        <!-- Logout Button -->
        <div style="text-align: center; margin-top: 20px;">
            <button onclick="logout()" style="background-color: #e74c3c; width: auto; padding: 10px 20px;">
                🚪 Logout
            </button>
        </div>
    </div>

    <script>
        // Function to submit form with JWT token in headers
		function submitForm() {
		    let token = localStorage.getItem('jwt');
		    if (!token) {
		        alert('No JWT token found. Please login again.');
		        window.location.href = '/api/auth/login';
		        return;
		    }

		    let form = document.getElementById('profileForm');
		    let formData = new FormData(form);

		    fetch('/api/auth/update', {
		        method: 'POST',
		        headers: {
		            'Authorization': 'Bearer ' + token,
		            'Content-Type': 'application/x-www-form-urlencoded',
		        },
		        body: new URLSearchParams(formData)
		    })
		    .then(response => response.text())   // ✅ Get Thymeleaf HTML back
		    .then(html => {
		        // ✅ Replace current page with updated Thymeleaf-rendered HTML
		        document.open();
		        document.write(html);
		        document.close();
		    })
		    .catch(error => {
		        console.error('Error:', error);
		        alert('Update failed. Please try again.');
		    });
		}

        // Function to go back to welcome page
        function goBack() {
            let token = localStorage.getItem('jwt');
            if (token) {
                window.location.href = '/api/auth/welcome?jwt_token=' + encodeURIComponent(token);
            } else {
                window.location.href = '/api/auth/login';
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('jwt');
            window.location.href = '/api/auth/login';
        }

        // Check if user is authenticated
        document.addEventListener('DOMContentLoaded', function() {
            let token = localStorage.getItem('jwt');
            if (!token) {
                // Try to get token from URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                token = urlParams.get('jwt_token');
                if (token) {
                    localStorage.setItem('jwt', token);
                } else {
                    alert('Please login first!');
                    window.location.href = '/api/auth/login';
                }
            }
        });
    </script>
</body>
</html>
