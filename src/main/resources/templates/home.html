<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - TaskHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f4f4f4;
            color: #000;
            margin: 0;
            padding: 0;
        }

        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 8px 15px;
            background-color: #3498db; /* blue navbar */
            color: white;
            position: relative;
        }

        /* Hamburger icon */
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }

        /* Dropdown menu */
        .dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 15px;
            background-color: white; /* white dropdown */
            border-radius: 5px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3);
            min-width: 160px;
            z-index: 1000;
        }

        /* Dropdown buttons */
        .dropdown button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            border: none;
            background: white;   /* plain white */
            text-align: left;
            cursor: pointer;
            font-size: 13px;     /* smaller font */
            color: black;        /* normal black text */
        }

        /* No hover highlight */
        .dropdown button:hover {
            background-color: white;
        }

        /* Success container */
        .success-container {
            background: #fff;
            padding: 20px;
            margin: 40px auto;
            border-radius: 10px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
        }

        .success-container h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .success-container p,
        .success-container h4 {
            font-size: 14px;
            margin: 8px 0;
        }

        .role-badge {
            background-color: #3498db;
            color: #fff;
            padding: 5px 10px;
            margin: 4px;
            border-radius: 10px;
            display: inline-block;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Top Navbar -->
    <div class="navbar">
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="dropdown" id="menuDropdown">
            <button onclick="navigateToProfile()">👤 View & Update Profile</button>
            <button onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <!-- Page content -->
    <div class="success-container">
        <h2>🎉 Welcome to TaskHub!</h2>
        <p><strong>Hello, </strong><span id="username" th:text="${response.username}"></span>!</p>
        
        <div style="background-color: #e8f5e8; padding: 12px; border-radius: 6px; margin: 15px 0; font-size: 13px;">
            <p><strong>Status:</strong> <span th:text="${response.message}"></span></p>
        </div>

        <div style="background-color: #f5f5f5; padding: 12px; border-radius: 6px; margin: 15px 0; font-size: 13px;">
            <h4>Your Role:</h4>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li th:each="role : ${response.roles}" class="role-badge">
                    <span th:text="${role}"></span>
                </li>
            </ul>
        </div>

        <!-- Hidden JWT for JS -->
        <span id="jwtToken" th:text="${response.token}" style="display:none;"></span>
    </div>

    <script>
        // Toggle dropdown menu
        function toggleMenu() {
            let menu = document.getElementById("menuDropdown");
            menu.style.display = (menu.style.display === "block") ? "none" : "block";
        }

        // Save JWT token into localStorage
        document.addEventListener("DOMContentLoaded", function () {
            let token = document.getElementById("jwtToken").textContent;
            if (token && token.trim() !== "") {
                localStorage.setItem("jwt", token);
                addTokenToRequests();
            }
        });

        // Function to add JWT token to AJAX + fetch
        function addTokenToRequests() {
            let originalXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function() {
                let xhr = this;
                originalXHROpen.apply(xhr, arguments);
                xhr.addEventListener('readystatechange', function() {
                    if (xhr.readyState === 1) {
                        let token = localStorage.getItem('jwt');
                        if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
                    }
                });
            };

            let originalFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                options.headers = options.headers || {};
                let token = localStorage.getItem('jwt');
                if (token) options.headers['Authorization'] = 'Bearer ' + token;
                return originalFetch(url, options);
            };
        }

        // Navigate to profile
        function navigateToProfile() {
            let token = localStorage.getItem('jwt');
            if (token) {
                window.location.href = '/api/auth/update?jwt_token=' + encodeURIComponent(token);
            } else {
                alert('No JWT token found. Please login again.');
                window.location.href = '/api/auth/login';
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('jwt');
            window.location.href = '/api/auth/login';
        }
    </script>
</body>
</html>
