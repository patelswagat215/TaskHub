<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Edit User Role - TaskHub</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/edit-roles.css}">
</head>

<body>
	<div class="container">
		<h2><span style="color:#2ecc71;">✏️</span> Edit User Role</h2>

		<form th:action="@{/api/auth/update-role}" method="post">
			<input type="hidden" name="id" th:value="${user.id}" />
			<input type="hidden" name="jwt_token" th:value="${jwt_token}" />

			<div class="form-group">
				<label>Username:</label>
				<div class="info" th:text="${user.name}"></div>
			</div>

			<div class="form-group">
				<label>Email:</label>
				<div class="info" th:text="${user.email}"></div>
			</div>

			<div class="form-group">
				<label>Current Role:</label>
				<div class="info" th:text="${user.role}"></div>
			</div>

			<div class="form-group">
				<label for="new-role">New Role:</label>
				<select id="new-role" name="role">
					<option th:selected="${user.role == 'ROLE_USER'}" value="ROLE_USER">ROLE_USER</option>
					<option th:selected="${user.role == 'ROLE_ADMIN'}" value="ROLE_ADMIN">ROLE_ADMIN</option>
				</select>
			</div>

			<div class="btn-group">
				<button type="submit" class="btn btn-save">Save Changes</button>
				<a class="btn btn-cancel" th:href="@{/api/auth/getallusers(jwt_token=${jwt_token})}">Cancel</a>
			</div>
		</form>
	</div>
</body>

</html>
