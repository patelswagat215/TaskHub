<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>User Registration - TaskHub</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/register.css}">

</head>

<body>
	<div class="container">
		<h2>TaskHub</h2>
		<h3>Create Your Account</h3>

		<div th:if="${message}" class="message-container message-success">
			<p th:text="${message}"></p>
		</div>

		<div th:if="${error}" class="message-container message-error">
			<p th:text="${error}"></p>
		</div>

		<form th:action="@{/api/auth/register}" method="post" th:object="${signupRequest}">
			<div>
				<label for="name">Full Name:</label>
				<input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required />
			</div>

			<div>
				<label for="email">Email Address:</label>
				<input type="email" id="email" th:field="*{email}" placeholder="Enter your email address" required />
			</div>

			<div>
				<label for="password">Password:</label>
				<input type="password" id="password" th:field="*{password}" placeholder="Create a strong password"
					required />
			</div>

			<div>
				<button type="submit">Create Account</button>
			</div>
		</form>

		<div class="login-redirect">
			<a th:href="@{/api/auth/login}">Already have an account? Login here</a>
		</div>
	</div>
</body>

</html>
