<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration- TaskHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Create Your TaskHub Account</h2>
        <h3>Join us today!</h3>

        <!-- Success Message -->
        <div th:if="${message}" style="background-color: #e8f5e8; color: #2e7d32; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            <p th:text="${message}"></p>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" style="background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            <p th:text="${error}"></p>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/api/auth/register}" method="post" th:object="${signupRequest}">
            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter your full name" required />
            </div>

            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Enter your email address" required />
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Create a strong password" required />
            </div>

            <div>
                <button type="submit">Create Account</button>
            </div>
        </form>

        <!-- Login Redirect -->
        <div style="text-align: center; margin-top: 20px;">
            <a th:href="@{/api/auth/login}" style="color: #3498db; text-decoration: none;">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
